databases:
  - name: krol-db
    databaseName: expense_tracker
    user: expense_tracker
    plan: free
    region: oregon

services:
  - type: web
    name: krol
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krol-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "https://krol-omega.vercel.app,https://krol-rd5ff7s5e-alexmakspain-ai.vercel.app,http://localhost:4200"
