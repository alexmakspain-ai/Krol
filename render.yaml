databases:
  - name: krol-db
    databaseName: expense_tracker
    user: expense_tracker
    plan: free

services:
  - type: web
    name: krol-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: krol-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: krol-frontend
          property: host

  - type: web
    name: krol-frontend
    runtime: static
    rootDir: frontend
    buildCommand: >-
      echo "export const environment = { production: true, apiBaseUrl: 'https://$BACKEND_HOST' };" > src/environments/environment.prod.ts &&
      npm ci &&
      npm run build -- --configuration production
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: krol-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
