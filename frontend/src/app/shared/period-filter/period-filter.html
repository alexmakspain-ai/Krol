<div class="period-filter">
  <button type="button" [class.active]="preset() === 'week'" (click)="presetSelected.emit('week')">
    {{ 'periodFilter.week' | translate }}
  </button>
  <button type="button" [class.active]="preset() === 'month'" (click)="presetSelected.emit('month')">
    {{ 'periodFilter.month' | translate }}
  </button>
  <button type="button" [class.active]="preset() === 'year'" (click)="presetSelected.emit('year')">
    {{ 'periodFilter.year' | translate }}
  </button>
  <button
    type="button"
    [class.active]="preset() === 'custom'"
    (click)="presetSelected.emit('custom')"
  >
    {{ 'periodFilter.custom' | translate }}
  </button>

  @if (preset() === 'custom') {
    <input
      type="date"
      [ngModel]="customStart()"
      (ngModelChange)="customStartChanged.emit($event)"
    />
    <span>—</span>
    <input type="date" [ngModel]="customEnd()" (ngModelChange)="customEndChanged.emit($event)" />
  }
</div>
