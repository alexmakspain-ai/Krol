<div class="expenses-chart">
  <div class="chart-header">
    <h2>{{ 'expensesChart.heading' | translate }}</h2>
    <button type="button" class="comparison-toggle" (click)="toggleComparison()">
      {{
        (comparisonVisible() ? 'expensesChart.hideComparison' : 'expensesChart.showComparison')
          | translate
      }}
    </button>
  </div>

  <app-single-expenses-chart #mainChart [categories]="categories()" initialPreset="month" />

  @if (comparisonVisible()) {
    <div class="comparison-section">
      <h3>{{ 'expensesChart.comparisonHeading' | translate }}</h3>
      <app-single-expenses-chart
        #comparisonChart
        [categories]="categories()"
        [initialRange]="comparisonInitialRange"
      />
    </div>
  }
</div>
