<section class="expenses-page">
  <app-expenses-chart [categories]="categories()" />

  <app-expense-form
    [categories]="categories()"
    (expenseAdded)="onExpenseAdded()"
    (categoryCreated)="onCategoryCreated($event)"
    (categoryDeleted)="onCategoryDeleted($event)"
  />

  <div id="expenses-table-section">
    <app-expenses-table
      [categories]="categories()"
      (categoryCreated)="onCategoryCreated($event)"
      (categoryDeleted)="onCategoryDeleted($event)"
      (expensesChanged)="onExpensesChanged()"
    />
  </div>
</section>
